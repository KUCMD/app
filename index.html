<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b2a5b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>KU-CMD | إدارة الإنشاءات والصيانة</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="app">
    <header id="topbar" class="topbar">
      <button id="btn-menu" class="icon-btn" aria-label="Menu"></button>
      <div id="top-title" class="top-title"></div>
      <button id="btn-back" class="icon-btn" aria-label="Back" hidden></button>
    </header>
    <section id="hero" class="hero" hidden></section>
    <main id="view" class="view"></main>
    <nav id="tabbar" class="tabbar" aria-label="Main"></nav>

    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" aria-hidden="true">
      <div id="drawer-body"></div>
    </aside>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <div id="loading" class="loading" hidden><div class="spinner"></div></div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
